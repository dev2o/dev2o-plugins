<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 486" width="1320" height="486" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="486" fill="#ffffff"/>

  <text x="32" y="32" font-size="18" font-weight="600" fill="#0f172a">You write one standing instruction. Who reads it decides whether anything gets built.</text>

  <g>
    <rect x="32" y="56" width="612" height="410" rx="14" fill="#fbfbfd" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="58" y="78" width="104" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="110" y="94" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.8" text-anchor="middle">BROADCAST</text>
    <text x="58" y="134" font-size="17" font-weight="600" fill="#0f172a">AGENTS.md or an always-on rule</text>

    <rect x="58" y="152" width="560" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="338" y="184" font-size="14" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" fill="#334155" text-anchor="middle">&#8220;Delegate all implementation to a subagent.&#8221;</text>

    <path d="M 338 206 L 143 244" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#ar-grey)"/>
    <path d="M 338 206 L 338 244" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#ar-grey)"/>
    <path d="M 338 206 L 533 244" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#ar-grey)"/>

    <g>
      <rect x="58" y="250" width="170" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="143" y="278" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Main agent</text>
      <rect x="72" y="292" width="142" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="143" y="312" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#64748b" text-anchor="middle">delegating this</text>
    </g>
    <g>
      <rect x="253" y="250" width="170" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="338" y="278" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">explore</text>
      <rect x="267" y="292" width="142" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="338" y="312" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#64748b" text-anchor="middle">delegating this</text>
    </g>
    <g>
      <rect x="448" y="250" width="170" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="533" y="278" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">code writer</text>
      <rect x="462" y="292" width="142" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="533" y="312" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#64748b" text-anchor="middle">delegating this</text>
    </g>

    <rect x="58" y="366" width="560" height="48" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="338" y="396" font-size="20" font-weight="700" fill="#b91c1c" text-anchor="middle">So the workers delegate too.</text>

    <text x="58" y="442" font-size="13" fill="#94a3b8">There is no way to say &#8220;this part is only for the agent I am talking to.&#8221;</text>
  </g>

  <g>
    <rect x="676" y="56" width="612" height="410" rx="14" fill="#fbfbfd" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="702" y="78" width="104" height="24" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
    <text x="754" y="94" font-size="11" font-weight="700" fill="#4f46e5" letter-spacing="0.8" text-anchor="middle">ADDRESSED</text>
    <text x="702" y="134" font-size="17" font-weight="600" fill="#0f172a">Agent Conductor</text>

    <rect x="702" y="152" width="170" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="787" y="177" font-size="12" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" fill="#1d4ed8" text-anchor="middle">__agent-main.md</text>
    <text x="787" y="194" font-size="10" fill="#3b82f6" text-anchor="middle">holds the delegate rule</text>

    <rect x="897" y="152" width="170" height="54" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="982" y="177" font-size="12" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" fill="#0f766e" text-anchor="middle">agent-explore.md</text>
    <text x="982" y="194" font-size="10" fill="#14b8a6" text-anchor="middle">how to search, and only that</text>

    <rect x="1092" y="152" width="170" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="1177" y="184" font-size="12" fill="#94a3b8" text-anchor="middle">no file for this one</text>

    <path d="M 787 206 L 787 244" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ar-blue)"/>
    <path d="M 982 206 L 982 244" stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#ar-green)"/>

    <g>
      <rect x="702" y="250" width="170" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="787" y="278" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Main agent</text>
      <rect x="716" y="292" width="142" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <text x="787" y="312" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#1d4ed8" text-anchor="middle">delegating this</text>
    </g>
    <g>
      <rect x="897" y="250" width="170" height="92" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
      <text x="982" y="278" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">explore</text>
      <rect x="911" y="292" width="142" height="30" rx="6" fill="#ccfbf1" stroke="#5eead4" stroke-width="1"/>
      <text x="982" y="312" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#0f766e" text-anchor="middle">searching</text>
    </g>
    <g>
      <rect x="1092" y="250" width="170" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="1177" y="278" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">code writer</text>
      <rect x="1106" y="292" width="142" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="1177" y="312" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#475569" text-anchor="middle">writing the code</text>
    </g>

    <rect x="702" y="366" width="560" height="48" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="982" y="396" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">So the workers work.</text>

    <text x="702" y="442" font-size="13" fill="#4f46e5">One file per role. No file for a role means nothing is sent to it.</text>
  </g>

</svg>
